version: 2
updates:
- package-ecosystem: npm
  directory: "/client"
  schedule:
    interval: monthly
    time: "12:00"
    timezone: America/Chicago
  open-pull-requests-limit: 5
  ignore:
    - dependency-name: '@types/node'
      update-types:
        - 'version-update:semver-major'
        - 'version-update:semver-minor'
  groups:
    monthly-batch:
      patterns:
        - "*"
- package-ecosystem: gradle
  directory: "/server"
  schedule:
    interval: monthly
    time: "12:00"
    timezone: America/Chicago
  open-pull-requests-limit: 20
  groups:
    monthly-batch:
      patterns:
        - "*"
- package-ecosystem: docker
  directory: "/server"
  schedule:
    interval: monthly
    time: "12:00"
    timezone: America/Chicago
  open-pull-requests-limit: 20
  ignore:
  - dependency-name: openjdk
    versions:
    - "> 21.pre.jdk.pre.slim"
  groups:
    monthly-batch:
      patterns:
        - "*"
- package-ecosystem: docker
  directory: "/client"
  schedule:
    interval: monthly
    time: "12:00"
    timezone: America/Chicago
  open-pull-requests-limit: 20
  groups:
    monthly-batch:
      patterns:
        - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
    time: "12:00"
    timezone: America/Chicago
  open-pull-requests-limit: 20
  groups:
    monthly-batch:
      patterns:
        - "*"
